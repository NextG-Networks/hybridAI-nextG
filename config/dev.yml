mode: dev
tick_ms: 100
bs_id: bs1
sim:
  dataset_root: /data/rome_static_medium
  scenario: { sched: "sched0", tr: "tr0", exp: "exp1", bs: "bs1" }
  # when ChangeScheduler occurs, switch sched stream for same tr/exp/bs
safety:
  cooldown_s: 120
  prb_delta_bounds: [-10, 10]
  rollback: { reward_drop_pct: 10, windows: 3 }
models:
  scheduler_selector: models/scheduler_selector.onnx
  prb_effect: models/prb_effect.onnx
  manifest: models/model_manifest.json
logging:
  level: DEBUG
